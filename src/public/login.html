<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14110F">
    <title>Login - Manga Reader</title>
  <script type="module" crossorigin src="/assets/login-B2ZJi5Zj.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/api-BzEASrxS.js">
  <link rel="stylesheet" crossorigin href="/assets/api-BaNuoHTP.css">
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <h1 class="login-logo">
                <svg class="logo-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linejoin="round" aria-hidden="true">
                    <polygon points="3,3 10.5,3 8.5,21 3,21" />
                    <polygon points="13,3 21,3 21,10.5 12.17,10.5" fill="#E03A2F" stroke="#E03A2F" />
                    <polygon points="11.89,13 21,13 21,21 11,21" />
                </svg>
                <span>Manga<span>Reader</span></span>
            </h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <p id="error-message" class="error-message" style="display: none;"></p>
            </form>
            <p class="login-demo-link"><a href="/demo.html">Just looking? Try the demo</a></p>
        </div>
    </div>
</body>

</html>
